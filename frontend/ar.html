<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1233" />
<title>Mitra — AR Avatar</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!--
  ========================================================================
  SWAP-IN POINT: replace MODEL_GLB_URL / MODEL_USDZ_URL below (in the
  <model-viewer> tag) with the real Mitra avatar export once the
  self-hosted rigged GLB/USDZ pipeline is ready. Everything else on this
  page is model-agnostic and needs no changes.
  ========================================================================
-->

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  :root{
    /* AR page palette: indigo / pink / amber glassmorphic, deliberately
       distinct from the main app's warm-ember theme, per request. */
    --ind-deep:#150F2E; --ind-mid:#1F1745; --ind-edge:#0D0920;
    --indigo:#6C63FF; --indigo-soft:#8B7FFF;
    --pink:#FF6FA5; --pink-soft:#FF9CC4;
    --amber:#FFB84D; --amber-soft:#FFD08A;
    --text:#F3F0FF; --muted:#B3A9E0; --faint:#7A6FA8;
    --line:rgba(230,222,255,.10); --line-glow:rgba(139,127,255,.35);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(108,99,255,.35) 0%, transparent 55%),
      radial-gradient(110% 90% at 100% 10%, rgba(255,111,165,.22) 0%, transparent 50%),
      radial-gradient(100% 80% at 50% 100%, rgba(255,184,77,.14) 0%, transparent 55%),
      var(--ind-deep);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:fixed; inset:0; overflow:hidden; overscroll-behavior:none;
    display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; gap:.7rem;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    position:relative; z-index:3;
  }
  #back-btn{
    appearance:none; background:rgba(255,255,255,.08); border:1.5px solid var(--line);
    color:var(--text); width:38px; height:38px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  #back-btn:hover{ border-color:var(--indigo-soft); background:rgba(108,99,255,.16); }
  .brand{
    display:flex; align-items:center; gap:.5rem; font-family:"Fraunces",serif; font-style:italic;
    font-weight:420; font-size:1.2rem;
    background:linear-gradient(90deg, var(--indigo-soft), var(--pink-soft), var(--amber-soft));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-sub{ font-size:.72rem; color:var(--faint); margin-left:.1rem; }

  #stage{
    flex:1; position:relative; margin:0 14px 14px; border-radius:24px; overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:
      0 30px 80px -30px rgba(0,0,0,.6),
      0 0 0 1px rgba(139,127,255,.08) inset;
  }

  model-viewer{
    width:100%; height:100%;
    --poster-color: transparent;
    background:transparent;
  }

  /* custom AR entry button, styled to match the page instead of the
     default model-viewer button */
  #ar-launch{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    appearance:none; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:.55rem;
    padding:.85rem 1.5rem; border-radius:100px;
    background:linear-gradient(90deg, var(--indigo), var(--pink));
    color:#fff; font-family:inherit; font-weight:600; font-size:.98rem;
    box-shadow:0 14px 36px -12px rgba(255,111,165,.55);
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  #ar-launch:hover{ transform:translateX(-50%) translateY(-2px); box-shadow:0 18px 42px -12px rgba(255,111,165,.7); }
  #ar-launch:active{ transform:translateX(-50%) scale(.97); }
  #ar-launch svg{ width:19px; height:19px; }

  /* loading state */
  #loading{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.8rem; color:var(--muted); font-size:.9rem; pointer-events:none;
    opacity:1; transition:opacity .4s var(--ease);
  }
  #loading.hide{ opacity:0; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(230,222,255,.15); border-top-color:var(--indigo-soft);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #hint{
    padding:0 22px calc(env(safe-area-inset-bottom) + 18px); text-align:center;
    color:var(--faint); font-size:.82rem; line-height:1.5;
  }
  #hint b{ color:var(--muted); }

  #not-supported{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:.7rem; padding:2rem; text-align:center; color:var(--muted); font-size:.92rem; line-height:1.6;
  }
  #not-supported.show{ display:flex; }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
  }
</style>
</head>
<body>

  <header>
    <button id="back-btn" aria-label="Back to Mitra" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="brand">Mitra</span>
    <span class="brand-sub">see her in your space</span>
  </header>

  <div id="stage">
    <div id="loading">
      <div class="spinner"></div>
      <span>loading avatar…</span>
    </div>

    <!--
      MODEL_GLB_URL / MODEL_USDZ_URL: placeholder assets from Google's
      model-viewer sample library, used to validate the full AR pipeline
      (Android WebXR + iOS Quick Look) before the real rigged Mitra avatar
      export is ready. To swap in the real avatar later, change ONLY the
      src and ios-src attributes below, nothing else on this page needs
      to change.
    -->
    <model-viewer
      id="mitra-model"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
      alt="Mitra avatar (placeholder model)"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1.1"
      exposure="1.0"
      environment-image="neutral"
      poster=""
      loading="eager"
      reveal="auto"
    >
      <button id="ar-launch" slot="ar-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
        view in your space
      </button>
    </model-viewer>

    <div id="not-supported">
      <span>AR isn't available on this device or browser.</span>
      <span>Try Chrome on Android or Safari on iOS, with camera access allowed.</span>
    </div>
  </div>

  <p id="hint">Tap <b>view in your space</b>, then point your camera at a flat surface like the floor or a desk.</p>

<script>
(function(){
  "use strict";
  var mv = document.getElementById("mitra-model");
  var loading = document.getElementById("loading");
  var notSupported = document.getElementById("not-supported");

  mv.addEventListener("load", function(){
    loading.classList.add("hide");
  });
  mv.addEventListener("error", function(){
    loading.classList.add("hide");
    notSupported.classList.add("show");
  });

  mv.addEventListener("ar-status", function(e){
    if (e.detail.status === "not-presenting" && !mv.canActivateAR){
      notSupported.classList.add("show");
    }
  });

  setTimeout(function(){
    if (mv.canActivateAR === false){
      notSupported.classList.add("show");
    }
  }, 2500);
})();
</script>
</body>
</html>
